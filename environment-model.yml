# Conda environment for the MODEL half of the pipeline (Section 5).
#
# CAPTURED, NOT INVENTED. Every version below was read on 2026-08-03 from
# /home/p.castaldi/.conda/envs/nmd_model on the Explorer cluster — the environment that
# ran the KernelSHAP jobs behind the current Section 5 numbers. It is the environment of
# record for the model, and it is NOT the one that renders the figures (see
# environment-figures.yml; this env has no seaborn at all).
#
# WHY VERSION-ONLY PINS AND NOT `conda env export`. A full export pins build strings
# (`py311h5f...`) and a platform (`linux-64`). Those identifiers exist on no other machine,
# so the export solves only on a clone of Explorer and fails everywhere else with an
# unsatisfiable-spec error that looks like a missing package. Version-only pins are exact
# in the sense that matters — same package, same version — and portable across platforms.
#
# WHY torch IS IN THE pip SECTION. torch is the one package here NOT installed from
# conda-forge; it came from pip as 2.5.1+cu121. The `+cu121` suffix is a PyTorch-index
# local version and is absent from PyPI's default index, so `pip install torch==2.5.1+cu121`
# fails without the index URL below.
#
# IF YOU DO NOT HAVE AN NVIDIA GPU: replace the two pip lines with plain `torch==2.5.1`.
# CUDA affects speed and floating-point association, not the model definition. Attribution
# values are floating-point sums and may differ in the last decimal places between CPU and
# GPU; the reported quantities are not sensitive at that scale, but they are not bitwise
# identical either, and this file should not pretend otherwise.

name: nmd_model
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - numpy=2.4.3
  - pandas=3.0.1
  - scipy=1.17.1
  - h5py=3.16.0
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - pyyaml=6.0.3
  - tqdm=4.67.3
  - pip
  # shap IS REQUIRED, not optional: deepshap.py imports it, and Figure 5D and every branch
  # attribution in the §5 report come from it. It was absent from every shipped environment while
  # the model repository's own environment.yml carried it, so a reader who built from this file
  # got an ImportError at the DeepSHAP step.
  #
  # 0.51, NOT 0.46, AND THE WRONG PIN WAS UNINSTALLABLE-BY-IMPORT RATHER THAN UNINSTALLABLE.
  # This line was added on 2026-08-12 to close that missing-shap finding, and the version was taken
  # from the model repository's environment.yml instead of being read off the environment this file
  # documents. Every other pin here was captured from that environment on 2026-08-03; this one was
  # not, and it was the one that broke.
  #
  # 0.46 RESOLVES, INSTALLS, AND THEN CANNOT BE IMPORTED under the numpy pinned six lines above:
  # shap 0.46 bundles a copy of scikit-image's _colorconv, which calls np.dtype(np.floating), and
  # numpy 2.x raises `TypeError: Converting np.inexact or np.floating to a dtype not allowed`. So
  # `docker build` exits 0 and the image cannot run the DeepSHAP or KernelSHAP steps. An install
  # check cannot see this; only an import can.
  #
  # Verified against the environment of record on 2026-08-13:
  #   conda list -p /home/p.castaldi/.conda/envs/nmd_model
  #   -> shap 0.51.0 cpu_py311hd1d3739_0 conda-forge, and `import shap` succeeds under numpy 2.4.3
  #
  # The Dockerfile now IMPORTS both environments after creating them, for the same reason the R
  # side loads all 187 packages rather than trusting renv::restore()'s exit code.
  - shap=0.51.*
  - pip:
      # BOTH INDEXES ARE REQUIRED AND THIS FILE HAD ONLY THE FIRST UNTIL 2026-08-12, WHICH MADE IT
      # UNINSTALLABLE. `--index-url` REPLACES PyPI rather than adding to it, so pip could see only
      # the PyTorch index. torch 2.5.1+cu121 pins `nvidia-cudnn-cu12==9.1.0.70` exactly, and that
      # index carries 9.0.0.312 and 9.1.1.17 and not 9.1.0.70 -- the wheel exists on PyPI, where pip
      # was not allowed to look. The install died with:
      #
      #     ERROR: No matching distribution found for nvidia-cudnn-cu12==9.1.0.70
      #
      # which names a CUDA library and reads like a GPU or platform problem. It is neither: it is an
      # index-configuration problem, and the marker in the message (platform_machine == "x86_64")
      # actively points the reader at their architecture, which is fine.
      #
      # HOW IT SURVIVED: the authoring environment predates this file -- environment-model.yml was
      # CAPTURED from a working conda env on 2026-08-03 rather than used to build one -- so nobody
      # had ever run it. It first ran on 2026-08-12, in the Docker build, and failed immediately.
      # A conda dry-run does NOT catch this: `micromamba create --dry-run` resolves the conda solve
      # and never executes the pip section, so this file "solved" cleanly while being uninstallable.
      #
      # Verified with full dependency resolution, not a dry run:
      #   pip install --dry-run --index-url .../cu121 --extra-index-url https://pypi.org/simple \
      #       torch==2.5.1+cu121
      #   -> Would install ... nvidia-cudnn-cu12-9.1.0.70 ... torch-2.5.1+cu121
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch==2.5.1+cu121
